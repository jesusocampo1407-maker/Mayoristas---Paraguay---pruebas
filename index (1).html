html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:640px;margin:0 auto;padding-bottom:84px}
svg.i{width:18px;height:18px;flex:none;vertical-align:-3px;margin-right:6px}
/* ===== 2. DISEÑO: cabecera y búsqueda ===== */
header{background:var(--ink);padding:18px 16px 18px;border-radius:0 0 24px 24px;border-bottom:2px solid var(--gold)}
.top{display:flex;align-items:center;gap:12px}
img.logo{width:42px;height:42px;display:block;flex:none;object-fit:contain;border-radius:12px}
h1{font-size:20px;margin:0;line-height:1.1;color:#fff;font-weight:700}
.sub{color:var(--gold-l);font-size:13px;margin:3px 0 0}
.search{margin:16px 0 0;display:flex;flex-direction:column;gap:10px}
.search input,.search select{width:100%;border:1px solid #3a3322;background:#1a1a1d;color:#fff;border-radius:14px;padding:13px 14px;font-size:16px;font-family:inherit}
.search input::placeholder{color:#9b9484}
.search input:focus,.search select:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.cityf{position:relative;display:block}
.cityf svg.i{position:absolute;left:14px;top:50%;margin:0;transform:translateY(-50%);color:var(--gold-l);pointer-events:none}
.cityf select{padding-left:42px;padding-right:40px;appearance:none;-webkit-appearance:none;font-weight:600;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%23e6c978' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 14px center}
.cityf option,.cityf optgroup{background:#1a1a1d;color:#fff}
/* ===== 3. DISEÑO: categorías ===== */
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 6px;scrollbar-width:none}
.chip{flex:none;display:inline-flex;align-items:center;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:999px;padding:9px 14px;font-size:14px;font-family:inherit;cursor:pointer}
.chip svg.i{color:var(--gold-t)}
.chip.on{background:var(--ink);color:var(--gold-l);border-color:var(--gold)}
.chip.on svg.i{color:var(--gold-l)}
.count{padding:8px 16px;color:var(--muted);font-size:13px}
.list{padding:0 16px 24px;display:grid;gap:16px}
/* ===== 4. DISEÑO: tarjetas de proveedores ===== */
.card{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--gold);border-radius:18px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;cursor:pointer}
.ph{aspect-ratio:1.1;display:grid;place-items:center;font-size:34px}
.ph.im{aspect-ratio:2/1;background-repeat:no-repeat;background-position:center;background-size:contain}
.photos .ph.im{grid-column:1/-1}
.body{padding:16px}
.name{font-weight:700;font-size:18px;margin:0}
.city{color:var(--muted);font-size:13px;margin:4px 0 10px}
.city svg.i{color:var(--gold-t);width:15px;height:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{background:var(--chip);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:3px 9px;font-size:12px}
.desc{font-size:14px;color:var(--muted);line-height:1.45;margin:0 0 12px}
.meta{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 14px}
.meta b{color:var(--text);font-weight:600}
.meta a{color:var(--gold-t)}
.btns{display:flex;gap:8px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;border-radius:12px;padding:13px;font-weight:600;font-size:15px;border:1.5px solid var(--line);color:var(--text);background:transparent;font-family:inherit;cursor:pointer}
.btn.wa{background:var(--wa-bg);border-color:var(--wa-bg);color:var(--wa-fg)}
.btn.gold{background:linear-gradient(135deg,#e6c978,#c9a24a);border-color:#c9a24a;color:#0b0b0c}
.ship{display:inline-flex;align-items:center;font-size:12px;color:var(--muted);border:1px dashed var(--border);border-radius:999px;padding:4px 10px;margin:-4px 0 14px}
.ship svg.i{width:15px;height:15px;margin-right:6px;color:var(--gold-t)}
.ship.ok{border-style:solid;border-color:var(--gold);color:var(--text)}
.fix{display:block;text-align:center;width:100%;margin-top:10px;background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;padding:8px;cursor:pointer;font-family:inherit}
.empty{text-align:center;color:var(--muted);padding:50px 20px}
/* ===== V6. OPINIONES (aditivo): estrellas, resumen y panel ===== */
.rv{margin:0 0 14px;padding:12px;border:1px solid var(--border);border-radius:14px;background:var(--chip)}
.rv-sum{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.rv-sum b{color:var(--text);font-size:15px}
.stars{position:relative;display:inline-block;line-height:0;white-space:nowrap}
.stars svg{width:16px;height:16px;margin-right:1px;fill:none;stroke:var(--gold);stroke-width:1.6;stroke-linejoin:round}
.stars .on{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap}
.stars .on svg{fill:var(--gold);stroke:var(--gold)}
.rv-acts{display:flex;gap:8px;margin-top:10px}
.rv-b{flex:1;font:600 13px inherit;font-family:inherit;padding:10px 8px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
.rv-b.gold{background:linear-gradient(135deg,#e6c978,#c9a24a);border-color:#c9a24a;color:#0b0b0c}
.rv-panel{margin-top:12px;border-top:1px solid var(--border);padding-top:12px}
.rv-empty{font-size:13px;color:var(--muted);text-align:center;padding:6px 0}
.rv-it{padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.rv-it:last-of-type{border-bottom:0}
.rv-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.rv-h b{font-size:13px}.rv-h small{color:var(--muted);font-size:11px}
.rv-it p{margin:4px 0 0;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.rv-bd{font-size:10px;font-weight:700;letter-spacing:.02em;border:1px solid var(--gold);color:var(--gold-t);border-radius:999px;padding:1px 7px}
.rv-bd.demo{border-style:dashed;color:var(--muted);border-color:var(--muted)}
.rv-more{width:100%;margin-top:8px}
.rv-form{margin-top:12px;padding:12px;border:1px solid var(--gold);border-radius:12px;background:var(--card)}
.rv-form h3{margin:0 0 8px;font-size:14px}
.rv-pick{display:flex;gap:2px;margin-bottom:8px}
.rv-pick button{background:none;border:0;padding:2px;cursor:pointer;line-height:0}
.rv-pick svg{width:30px;height:30px;fill:none;stroke:var(--gold);stroke-width:1.6;stroke-linejoin:round}
.rv-pick button.on svg{fill:var(--gold)}
.rv-form textarea{width:100%;min-height:80px;resize:vertical;border:1px solid var(--border);border-radius:10px;padding:10px;font:14px inherit;font-family:inherit;background:var(--bg);color:var(--text)}
.rv-form .rv-note{font-size:12px;color:var(--muted);margin:8px 0}
.rv-msg{font-size:12px;margin-top:8px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--chip);color:var(--text)}
.rv-msg.err{border-color:#b3261e}
.rv-demo{margin:8px 16px;padding:10px 12px;border:2px dashed var(--gold);border-radius:12px;font-size:12px;background:var(--chip);color:var(--text)}
/* ===== BETA: cuentas (aditivo) ===== */
.acct-btn{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--gold);background:transparent;color:var(--gold-l);border-radius:999px;padding:8px 12px;font:600 13px inherit;font-family:inherit;cursor:pointer;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-btn.in{background:var(--gold);color:#0b0b0c}
#acct{z-index:30}
#acct .sheet h2{margin:4px 0 4px;font-size:20px}
#acct .sub2{color:var(--muted);font-size:13px;margin:0 0 6px}
#acct .lnk{background:none;border:0;color:var(--gold-t);text-decoration:underline;font:inherit;font-size:13px;cursor:pointer;padding:6px 0}
#acct .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#acct .row .btn{flex:1;min-width:130px}
#acct .st{display:inline-block;font-size:12px;font-weight:700;border:1px solid var(--gold);border-radius:999px;padding:2px 10px;color:var(--gold-t)}
#acct .st.ok{background:var(--gold);color:#0b0b0c}
#acct .msg{font-size:13px;line-height:1.4;margin:12px 0 0;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--chip)}
#acct .msg.err{border-color:#b3261e}
#acct .msg.good{border-color:var(--gold)}
#acct .adm{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:13px;background:var(--chip)}
#acct .adm p{margin:3px 0;word-break:break-word}
#acct .btn[disabled]{opacity:.55;cursor:wait}
/* ===== 5. DISEÑO: bloque «Sos mayorista» y aviso ===== */
.cta{margin:12px 16px 12px;padding:16px;border-radius:18px;background:var(--ink);border:1px solid var(--gold);color:#fff;display:flex;align-items:center;gap:12px;font-size:14px}
.cta div{flex:1}.cta b{color:var(--gold-l);font-size:15px}.cta span{color:#cfc8b6;font-size:12px}
.cta .btn{flex:none;padding:11px 12px}
.note{margin:0 16px 12px;padding:10px 12px;border-radius:12px;background:var(--chip);border:1px solid var(--border);font-size:12px;color:var(--muted)}
/* ===== 6. DISEÑO: ventanas y formulario de marca ===== */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:24px 24px 0 0;border-top:3px solid var(--gold);padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.big{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:12px 0}
.big .ph{aspect-ratio:1.3;border-radius:12px;font-size:48px}
.big .ph.im{grid-column:1/-1;aspect-ratio:2/1}
.close{float:right;border:1px solid var(--border);background:var(--chip);color:var(--text);width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer}
.lb,.lt{display:block;font-size:14px;font-weight:600;margin:14px 0 0}
.lb input,.lb select,.lb textarea{display:block;width:100%;margin-top:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:12px;padding:12px;font-size:16px;font-family:inherit;font-weight:400}
.lb input:focus,.lb select:focus,.lb textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.cks{display:grid;gap:6px;margin-top:8px}
.ck{display:flex;align-items:center;gap:10px;background:var(--chip);border:1px solid var(--border);border-radius:12px;padding:11px 12px;font-size:14px}
.ck svg.i{margin:0;color:var(--gold-t)}
.ck input{width:20px;height:20px;margin:0;accent-color:#c9a24a}
.warn{background:var(--chip);border:1px solid var(--gold);border-radius:12px;padding:10px 12px;font-size:13px;margin:12px 0}
.res{font-size:14px;line-height:1.4;margin:10px 0 0}
/* ===== 7. DISEÑO: navegación inferior ===== */
.bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:640px;z-index:10;display:flex;background:var(--ink);border-top:2px solid var(--gold);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.bar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:#bdb6a3;font-size:11px;font-family:inherit;padding:6px 0;cursor:pointer}
.bar button svg.i{width:22px;height:22px;margin:0}
.bar button.on{color:var(--gold-l)}
</style>
</head>

    '<span class="lt">Categorías</span><div class="cks">'+cs+'</div>'+
    '<label class="lb">Cobertura de envíos<select name="shipping">'+sh("pais","Todo el país")+sh("ciudades","Determinadas ciudades")+sh("local","Solo venta en local")+sh("consultar","Por consultar")+'</select></label>'+
    '<label class="lb">Detalle de envíos (opcional)<input name="shippingNotes" maxlength="200" value="'+esc(b.shippingNotes)+'"></label>'+
    '<div class="cks" style="margin-top:12px">'+ck("imports","Realizo importación",b.imports)+ck("exports","Realizo exportación",b.exports)+'</div></fieldset>'+
    (ap?'<p class="sub2" style="margin-top:12px">Tu negocio está aprobado. Para cambiar datos, enviá una solicitud de cambio:</p><label class="lb">Cambio que necesitás<textarea name="change" rows="3" maxlength="500"></textarea></label><div class="row"><button class="btn gold" type="submit">Enviar solicitud de cambio</button></div>':'<div class="row"><button class="btn gold" type="submit">Enviar para revisión</button></div>')+'</form>'}
async function doBiz(f,b){
  const raw=new FormData(f),g=function(k){return String(raw.get(k)||"").trim()};
  if(BIZ&&BIZ.status==="approved"){
    const m=g("change");if(m.length<5)return setMsg("Describí el cambio (mínimo 5 caracteres).","err");
    return busy(b,async function(){try{await F.addDoc(F.collection(db,"changeRequests"),{ownerUid:S.user.uid,message:m,status:"pending",createdAt:F.serverTimestamp()});f.reset();setMsg("Solicitud enviada. El administrador la revisará.","good")}catch(e){setMsg(errTxt(e),"err")}})}
  const d={name:g("name"),city:g("city"),whatsapp:g("whatsapp").replace(/[\s+\-()]/g,""),products:g("products"),categories:raw.getAll("cat"),shipping:g("shipping"),shippingNotes:g("shippingNotes"),imports:raw.get("imports")==="on",exports:raw.get("exports")==="on"};
  if(d.name.length<2)return setMsg("Escribí el nombre del negocio.","err");
  if(d.city.length<2)return setMsg("Escribí la ciudad.","err");
  if(!/^\d{9,15}$/.test(d.whatsapp))return setMsg("El WhatsApp debe tener solo números, con código de país (9 a 15 dígitos).","err");
  if(d.products.length<3)return setMsg("Contanos qué productos ofrecés.","err");
  if(!d.categories.length)return setMsg("Elegí al menos una categoría.","err");
  await busy(b,async function(){try{
    const ref=F.doc(db,"businessRequests",S.user.uid);
    if(BIZ)await F.updateDoc(ref,Object.assign({},d,{status:"pending",updatedAt:F.serverTimestamp()}));
    else await F.setDoc(ref,Object.assign({ownerUid:S.user.uid},d,{status:"pending",createdAt:F.serverTimestamp(),updatedAt:F.serverTimestamp()}));
    S.msg={t:"Datos enviados. Quedan pendientes de revisión del administrador.",k:"good"};await loadBiz();setMsg(S.msg.t,"good")}catch(e){setMsg(errTxt(e),"err")}})}

/* ---------- Administrador (las reglas de Firestore son las que realmente protegen) ---------- */
function adminView(){
  if(!S.admin)return head("Administración")+'<div class="msg err">Acceso restringido al administrador.</div><div class="row"><button class="btn" data-a="go-home">Volver</button></div>';
  return head("Administración","Pendientes de revisión.")+'<div id="admBox"><p class="sub2">Cargando…</p></div>'+msgH()}
const ADM=[["businessRequests","Negocios"],["reviews","Opiniones"],["changeRequests","Cambios solicitados"]];
async function loadAdmin(){
  let h="";
  for(const c of ADM){
    try{const s=await F.getDocs(F.query(F.collection(db,c[0]),F.where("status","==","pending")));
      h+='<h3 style="margin:16px 0 4px;font-size:15px">'+c[1]+' ('+s.size+')</h3>';
      s.forEach(function(d){const x=d.data(),t=c[0]==="businessRequests"?'<p><b>'+esc(x.name)+'</b> · '+esc(x.city)+' · WhatsApp '+esc(x.whatsapp)+'</p><p>'+esc(x.products)+'</p><p>Categorías: '+esc((x.categories||[]).join(", "))+' · Envíos: '+esc(x.shipping)+(x.imports?" · Importa":"")+(x.exports?" · Exporta":"")+'</p>':c[0]==="reviews"?'<p><b>'+esc(x.authorName)+'</b> → proveedor '+esc(x.providerId)+' · '+esc(x.rating)+'★</p><p>'+esc(x.text)+'</p>':'<p>Negocio '+esc(x.ownerUid)+'</p><p>'+esc(x.message)+'</p>';
        h+='<div class="adm">'+t+'<div class="row"><button class="btn gold" data-a="mod" data-c="'+c[0]+'" data-id="'+esc(d.id)+'" data-s="approved">'+(c[0]==="changeRequests"?"Marcar resuelta":"Aprobar")+'</button><button class="btn" data-a="mod" data-c="'+c[0]+'" data-id="'+esc(d.id)+'" data-s="rejected">Rechazar</button></div></div>'})}
    catch(e){h+='<div class="msg err">'+c[1]+': '+esc(errTxt(e))+'</div>'}}
  if($("admBox"))$("admBox").innerHTML=h}
async function doMod(b){
  await busy(b,async function(){try{await F.updateDoc(F.doc(db,b.dataset.c,b.dataset.id),{status:b.dataset.s,reviewedBy:S.user.uid,reviewedAt:F.serverTimestamp()});await loadAdmin()}catch(e){setMsg(errTxt(e),"err")}})}

/* ---------- Eventos ---------- */
$("acctBtn").addEventListener("click",function(){open()});
$("acct").addEventListener("click",function(e){
  if(e.target===$("acct"))return close();
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
  if(a==="close")close();
  else if(a==="showpw"){document.querySelectorAll("#acctSheet [data-pw]").forEach(function(i){i.type=b.checked?"text":"password"})}
  else if(a.indexOf("go-")===0){S.msg=null;S.view=a.slice(3);paint()}
  else if(a==="logout"){F.signOut(auth).then(function(){S.msg=null;S.view="login";close()})}
  else if(a==="resend")doResend(b);
  else if(a==="refresh")doRefresh(b);
  else if(a==="mod")doMod(b)});
$("acct").addEventListener("submit",function(e){
  e.preventDefault();const f=e.target.closest("form[data-f]");if(!f)return;const b=f.querySelector('button[type="submit"]'),k=f.dataset.f;
  ({login:doLogin,register:doRegister,reset:doReset,complete:doComplete,biz:doBiz})[k](f,b)});
document.addEventListener("keydown",function(e){if(e.key==="Escape")close()});
btn();init();
window.MPAccount={state:S};
</script>
